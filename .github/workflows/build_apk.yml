name: Zbuduj APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Javy
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Konfiguracja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Napraw brakujące environment w pubspec.yaml
        run: |
          if ! grep -q "environment:" pubspec.yaml; then
            echo -e "\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
          fi

      - name: Wygeneruj projekt Androida (jeśli brak)
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Pobierz pakiety Fluttera
        run: flutter pub get

      - name: Wyłącz minifikację R8 w Androidzie
        run: |
          find android -name "build.gradle*" -exec sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/isShrinkResources = true/isShrinkResources = false/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minifyEnabled true/minifyEnabled false/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/shrinkResources true/shrinkResources false/g' {} +

      - name: Zbuduj plik APK
        run: flutter build apk --release

      - name: Zapisz gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikacja-release
          path: build/app/outputs/flutter-apk/app-release.apk
