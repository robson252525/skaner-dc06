name: Buduj APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Javy
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inicjalizacja projektu Flutter
        run: flutter create --project-name skaner_dc06 . --platforms=android

      - name: Instalacja zaleznosci
        run: flutter pub add google_mlkit_text_recognition google_mlkit_barcode_scanning image_picker

      - name: Budowanie pliku APK
        run: flutter build apk --release

      - name: Zapisz gotowy plik APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
